  </defs>

  <!-- tile -->
  <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#bg)"/>

  <!-- finder: top-left -->
  <rect x="137" y="137" width="102" height="102" rx="22" fill="#ffffff"/>
  <rect x="163" y="163" width="50" height="50" rx="12" fill="#3730a3"/>
  <rect x="180" y="180" width="16" height="16" rx="4" fill="#ffffff"/>

  <!-- finder: top-right -->
  <rect x="273" y="137" width="102" height="102" rx="22" fill="#ffffff"/>
  <rect x="299" y="163" width="50" height="50" rx="12" fill="#3730a3"/>
  <rect x="316" y="180" width="16" height="16" rx="4" fill="#ffffff"/>

  <!-- plate: bottom-left (the menu) -->
  <circle cx="188" cy="324" r="48" fill="#ffffff"/>
  <circle cx="188" cy="324" r="24" fill="none" stroke="#3730a3" stroke-width="10"/>

  <!-- data modules -->
  <rect x="239" y="171" width="26" height="26" rx="8" fill="#ffffff"/>
  <rect x="171" y="239" width="26" height="26" rx="8" fill="#ffffff"/>
  <rect x="239" y="239" width="34" height="34" rx="9" fill="#ffffff"/>

  <!-- bottom-right 2x2 cluster -->
  <rect x="273" y="273" width="26" height="26" rx="8" fill="#ffffff"/>
  <rect x="341" y="273" width="26" height="26" rx="8" fill="#ffffff"/>
