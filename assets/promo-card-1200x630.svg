<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131f3a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#acc)"/>

  <!-- faint QR decorations -->
  <g opacity="0.055" fill="#ffffff">
    <rect x="950" y="40" width="190" height="190" rx="44"/>
    <rect x="950" y="260" width="60" height="60" rx="16"/>
    <rect x="1040" y="240" width="36" height="36" rx="10"/>
    <rect x="40" y="440" width="150" height="150" rx="36"/>
    <rect x="220" y="500" width="44" height="44" rx="12"/>
  </g>

  <!-- version badge -->
  <rect x="400" y="56" width="400" height="58" rx="29" fill="#fbbf24"/>
  <text x="600" y="96" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"
        font-size="28" font-weight="bold" fill="#0b1220">v1.0.0 &#8212; now available</text>

  <!-- lockup: mark 150 + wordmark -->
  <g transform="translate(460,148) scale(0.29296875)">
    <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#mark)"/>
    <rect x="137" y="137" width="102" height="102" rx="22" fill="#ffffff"/>
    <rect x="163" y="163" width="50" height="50" rx="12" fill="#3730a3"/>
    <rect x="180" y="180" width="16" height="16" rx="4" fill="#ffffff"/>
    <rect x="273" y="137" width="102" height="102" rx="22" fill="#ffffff"/>
    <rect x="299" y="163" width="50" height="50" rx="12" fill="#3730a3"/>
    <rect x="316" y="180" width="16" height="16" rx="4" fill="#ffffff"/>
    <circle cx="188" cy="324" r="48" fill="#ffffff"/>
    <circle cx="188" cy="324" r="24" fill="none" stroke="#3730a3" stroke-width="10"/>
    <rect x="239" y="171" width="26" height="26" rx="8" fill="#ffffff"/>
    <rect x="171" y="239" width="26" height="26" rx="8" fill="#ffffff"/>
    <rect x="239" y="239" width="34" height="34" rx="9" fill="#ffffff"/>
    <rect x="273" y="273" width="26" height="26" rx="8" fill="#ffffff"/>
    <rect x="341" y="273" width="26" height="26" rx="8" fill="#ffffff"/>
    <rect x="273" y="341" width="26" height="26" rx="8" fill="#ffffff"/>
    <rect x="341" y="341" width="34" height="34" rx="9" fill="#fbbf24"/>
  </g>
  <text x="640" y="262" font-family="DejaVu Sans, Verdana, sans-serif" font-size="84"
        font-weight="bold" letter-spacing="-1"><tspan fill="#ffffff">fral</tspan><tspan fill="#2dd4bf">QR</tspan></text>

  <!-- tagline -->
  <text x="600" y="392" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"
        font-size="42" font-weight="bold" fill="#ffffff">Feed it a PDF menu. Print the QR codes.</text>
  <text x="600" y="448" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"
        font-size="27" fill="#94a3b8">PDF &#8594; QR codes &#183; Image(s) &#8594; PDF &#183; In-window preview &#183; No external browser</text>

  <!-- CTA -->
  <rect x="260" y="506" width="680" height="58" rx="29" fill="url(#acc)"/>
  <text x="600" y="544" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"
        font-size="26" font-weight="bold" fill="#0b1220">Free download &#8212; github.com/fralsare/fralQR</text>

  <text x="600" y="606" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif"
        font-size="22" fill="#64748b">MIT License &#183; Windows &amp; Linux &#183; 100% free</text>
</svg>
