<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fralQR — Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      width: min(96vw, 1280px);
      position: relative;
    }
    .player {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
    }
    .player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 12px;
    }
    #hint {
      color: #8b949e;
      font-size: 14px;
      margin: 12px 0 0;
      text-align: center;
    }
    h1 {
      color: #e6edf3;
      font-size: 18px;
      font-weight: 600;
      margin: 6px 0 0;
      text-align: center;
    }
    h1 a {
      color: #58a6ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="player">
      <iframe
        src="https://www.youtube.com/embed/vknbgj5KRxQ?autoplay=1&mute=1&rel=0"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    </div>
    <p id="hint">🔇 Video starts automatically (muted, as browsers require) —
      click the speaker icon in the player to turn sound on.</p>
    <h1>fralQR — PDF menu to print-ready QR codes &middot;
      <a href="https://github.com/fralsare/fralQR">github.com/fralsare/fralQR</a></h1>
  </div>
</body>
</html>
