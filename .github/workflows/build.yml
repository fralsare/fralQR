# ---------------------------------------------------------------------------
# fralQR - build all release artifacts and publish them as a GitHub Release.
#
# What it produces:
#   Linux   : fralQR_<ver>_<arch>.deb
#             fralQR-<ver>-<rel>.<arch>.rpm
#             fralQR-<ver>-<arch>.AppImage
#   Windows : fralQR-<ver>-windows-portable.exe   (single file, no install)
#             fralQR-Setup-<ver>.exe              (Inno Setup installer)
#
# Triggers:
#   - on every push/PR to main (builds artifacts you can download from the run)
#   - on a tag  v*.*.*          (builds + creates/updates the GitHub Release)
#   - manually:  "Run workflow" button
#
# Actions are pinned to commit SHAs for supply-chain safety. Tag for each SHA:
#   actions/checkout@v4            = 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python@v5        = a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-artifact@v4     = ea165f8d65b6e75b540449e92b4886f43607fa02
#   actions/download-artifact@v4   = d3f86a106a0bac45b974a628896c90dbdf5c8093
#
# The release itself is published with the preinstalled `gh` CLI (no extra
# third-party action to pin or maintain).
#
# NOTE: the version is kept in one place here (env.VERSION). Keep it in sync
# with APP_VERSION in fralQR.py and the Version in packaging/*.spec / *.iss.
# ---------------------------------------------------------------------------
name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  APP: fralQR
  VERSION: 1.0.0

jobs:
  # ------------------------------------------------------------------ Linux
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install build deps (rpm toolchain, squashfs, tk)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk python3-pil \
            rpm squashfs-tools

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Ensure icons
        run: |
          if [ ! -f packaging/icon.png ] || [ ! -f packaging/icon.ico ]; then
            python -m pip install --quiet pillow
            python packaging/make_icon.py
          fi

      - name: Build bundle + .deb + .rpm (+ .AppImage)
        run: bash packaging/build_linux.sh

      - name: Verify .deb and .rpm
        run: |
          set -euo pipefail
          dpkg-deb --info dist/${APP}_${VERSION}_*.deb
          rpm -qip $(find dist -name '*.rpm')

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ env.APP }}-${{ env.VERSION }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Ensure icons
        run: |
          if (-not (Test-Path packaging\icon.png) -or
              -not (Test-Path packaging\icon.ico)) {
            python -m pip install --quiet pillow
            python packaging\make_icon.py
          }

      - name: Build portable .exe + installer .exe
        run: |
          # Make sure ISCC is discoverable even if Chocolatey did not add
          # the Inno Setup dir to PATH for this shell.
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          .\packaging\build_windows.bat

      - name: List artifacts
        run: |
          Get-ChildItem dist -File | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ env.APP }}-${{ env.VERSION }}
          path: |
            dist/fralQR-1.0.0-windows-portable.exe
            dist/fralQR-Setup-1.0.0.exe

  # ------------------------------------------- Create / update the Release
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets

      - name: Show collected files
        run: |
          find release-assets -type f \
            \( -name '*.deb' -o -name '*.rpm' \
               -o -name '*.AppImage' -o -name '*.exe' \)

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          FILES=(release-assets/**/*.deb release-assets/**/*.rpm
                 release-assets/**/*.AppImage release-assets/**/*.exe)
          [ "${#FILES[@]}" -gt 0 ] || { echo "no artifacts"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" --title "fralQR ${TAG}" \
              --target "${GITHUB_REF}" --notes "fralQR ${TAG}" "${FILES[@]}"
          fi
